<style>
/* ==========================================================
   LOS FELIZ ANIMAL RESCUE — "Quiet" direction
   VARIATION: 50% column
   Everything — navigation, photograph, name — sits in a
   centred column half the width of the window, so the links
   gather into one tight line instead of spanning the screen.
   Change --col below to widen or narrow the whole page.
   ========================================================== */
:root{
  --ink:#000;
  --font:"Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --micro:12px;            /* the whole page runs at one type size */
  --track:.14em;
  --edge:34px;             /* minimum margin from the page edge */
  --col:50%;               /* <-- the width of the whole page. change this one value. */
}

/* the single measure everything lines up to */
nav, main, footer{
  width:min(var(--col), calc(100% - (var(--edge) * 2)));
  margin-inline:auto;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:#fff; color:var(--ink);
  font-family:var(--font); font-size:var(--micro); font-weight:400;
  letter-spacing:var(--track); text-transform:lowercase;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
  overflow:hidden;
}

/* ---------- navigation: text only, along the top ---------- */
nav{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:var(--edge) 0 0;
  flex:none;
}
nav a{
  color:var(--ink); text-decoration:none; padding:2px 0;
  border-bottom:1px solid transparent;
  transition:border-color .25s ease, opacity .25s ease;
}
nav a:hover{border-bottom-color:var(--ink)}
nav:hover a:not(:hover){opacity:.38}

/* ---------- the photograph ---------- */
main{
  flex:1; display:grid; place-items:center;
  padding:20px 0;
  min-height:0;
}
main img{
  display:block;
  max-height:100%; max-width:100%;
  height:auto; width:auto;
  object-fit:contain;
  animation:settle 1.1s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes settle{
  from{opacity:0; transform:translateY(10px) scale(.985)}
  to{opacity:1; transform:none}
}

/* ---------- the name ---------- */
footer{
  flex:none; padding:0 0 var(--edge);
  display:flex; justify-content:space-between; align-items:baseline;
}
footer .name{font-weight:500}
footer .aside{opacity:.42}

/* below ~1100px a literal 50% gets too cramped for seven links */
@media (max-width:1100px){ :root{--col:72%} }
@media (max-width:860px){  :root{--col:100%} }

@media (max-width:760px){
  :root{--edge:20px; --micro:11px; --track:.1em}
  nav{flex-wrap:wrap; gap:14px 18px; justify-content:center}
  main{padding:24px 0}
  footer{justify-content:center; text-align:center}
  footer .aside{display:none}
}
</style>
