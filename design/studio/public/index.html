<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Studio</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app" id="app">

  <aside class="pane pane-pages" id="pagesPane" aria-label="Pages">
    <div class="pane-header">
      <h2 class="pane-title">Pages</h2>
      <button type="button" class="icon-btn" id="minimizePagesBtn" aria-label="Minimize pages pane" title="Minimize pages pane">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 4 L4 12 M4 8 L12 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="pane-body pages-list" id="pagesList"></div>
  </aside>

  <button type="button" class="pages-rail" id="expandPagesBtn" aria-label="Expand pages pane" title="Expand pages pane">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 8 L12 8 M9 5 L12 8 L9 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <main class="pane pane-preview" id="previewPane" aria-label="Preview">
    <div class="pane-header">
      <h2 class="pane-title">Preview</h2>
      <div class="pane-actions">
        <button type="button" class="icon-btn" id="reloadBtn" aria-label="Reload preview" title="Reload preview">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M12.5 8a4.5 4.5 0 1 1-1.4-3.27M12.5 3v3h-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="icon-btn" id="maximizeBtn" aria-label="Maximize preview" title="Maximize preview">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="preview-body">
      <iframe id="previewFrame" class="preview-frame" title="Page preview" hidden></iframe>
      <div class="preview-empty" id="previewEmpty" role="status"></div>
    </div>
    <button type="button" class="restore-btn" id="restoreBtn" aria-label="Restore three-pane layout" title="Restore layout (Esc)" hidden>
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 2v4H2M10 2v4h4M6 14v-4H2M10 14v-4h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </main>

  <aside class="pane pane-chat" id="chatPane" aria-label="Chat">
    <div class="pane-header">
      <h2 class="pane-title">Chat</h2>
    </div>
    <div class="chat-history" id="chatHistory" aria-live="polite"></div>
    <form class="chat-form" id="chatForm">
      <label class="sr-only" for="chatInput">Describe an edit</label>
      <textarea id="chatInput" rows="2" placeholder="Describe an edit…" disabled></textarea>
      <div class="chat-actions">
        <button type="submit" class="btn btn-primary" id="sendBtn" disabled>Send</button>
        <button type="button" class="btn" id="saveAsBtn" disabled>Save as new page</button>
      </div>
      <p class="working-indicator" id="workingIndicator" hidden>Working…</p>
    </form>
    <div class="save-panel" id="savePanel" hidden>
      <label for="saveNameInput">Save as</label>
      <input type="text" id="saveNameInput" autocomplete="off" spellcheck="false">
      <div class="save-actions">
        <button type="button" class="btn btn-primary" id="saveConfirmBtn">Save</button>
        <button type="button" class="btn" id="saveCancelBtn">Cancel</button>
      </div>
      <p class="save-error" id="saveError" role="alert" hidden></p>
    </div>
  </aside>

</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
